<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><circle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%232f6fed%22/></svg>">
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --text: #1d2330;
      --muted: #6b7385;
      --line: #e3e6ec;
      --accent: #2f6fed;
      --warn: #c77700;
      --ok: #1f8a4c;
      --err: #c62828;
      --code: #f0f2f5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161b;
        --panel: #1c1f26;
        --text: #e6e8ee;
        --muted: #9097a6;
        --line: #2c313b;
        --accent: #6b9bff;
        --warn: #f0a43a;
        --ok: #4cc27e;
        --err: #ff6b6b;
        --code: #242832;
      }
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font: 14px/1.5 system-ui, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    header {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
      flex-wrap: wrap
    }

    header b {
      margin-right: 16px;
      padding: 12px 0
    }

    header a {
      color: var(--muted);
      text-decoration: none;
      padding: 12px 10px;
      border-bottom: 2px solid transparent
    }

    header a.on {
      color: var(--text);
      border-bottom-color: var(--accent)
    }

    header .count {
      background: var(--warn);
      color: #fff;
      border-radius: 9px;
      padding: 0 6px;
      font-size: 11px;
      margin-left: 4px
    }

    #classic-account { position: relative; margin-left: auto; padding: 8px }
    #classic-account summary { cursor: pointer }
    #classic-account nav { position: fixed; right: 16px; max-height: calc(100dvh - 160px); overflow-y: auto; width: min(280px, calc(100vw - 32px)); display: grid; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: 0 8px 24px #0002 }
    #classic-account nav a { padding: 10px; border: 0 }
    #classic-account nav button { margin-top: 12px; color: var(--err) }
    main {
      padding: 20px 28px;
      max-width: 1280px;
      margin: 0 auto
    }

    h2 {
      font-size: 19px;
      margin: 0 0 4px
    }

    h3 {
      font-size: 13px;
      margin: 22px 0 8px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em
    }

    h4 {
      margin: 0 0 6px;
      font-size: 14px
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden
    }

    th,
    td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 13px
    }

    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em
    }

    tr.click {
      cursor: pointer
    }

    tr.click:hover td {
      background: color-mix(in srgb, var(--accent) 7%, transparent)
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 1px 8px;
      border-radius: 10px;
      border: 1px solid currentColor;
      white-space: nowrap
    }

    .s-RUNNING,
    .s-READY,
    .s-RETRYING,
    .s-in_progress {
      color: var(--accent)
    }

    .s-WAITING,
    .s-WAITING_INPUT,
    .s-WAITING_APPROVAL,
    .s-PAUSED,
    .s-open {
      color: var(--warn)
    }

    .s-COMPLETED,
    .s-done,
    .s-answered {
      color: var(--ok)
    }

    .s-FAILED,
    .s-STALE {
      color: var(--err)
    }

    .s-CANCELED,
    .s-SKIPPED,
    .s-PENDING,
    .s-archived,
    .s-dismissed {
      color: var(--muted)
    }

    .chips {
      display: flex;
      gap: 3px;
      flex-wrap: wrap
    }

    .chip {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: currentColor;
      opacity: .85
    }

    textarea,
    input,
    select {
      font: inherit;
      color: inherit;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      width: 100%
    }

    textarea.code,
    pre {
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    pre {
      background: var(--code);
      padding: 10px;
      border-radius: 6px;
      overflow: auto;
      max-height: 420px;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 6px 0
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 3px
    }

    button {
      font: inherit;
      border: 0;
      border-radius: 6px;
      padding: 6px 13px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      white-space: nowrap
    }

    button.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line)
    }

    button.warn {
      background: var(--warn)
    }

    button.danger {
      background: var(--err)
    }

    button.ok {
      background: var(--ok)
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    button.sm {
      padding: 3px 9px;
      font-size: 12px
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 8px
    }

    .row>input,
    .row>select {
      width: auto;
      flex: 1
    }

    .muted {
      color: var(--muted)
    }

    .small {
      font-size: 12px
    }

    .mono {
      font-family: ui-monospace, monospace;
      font-size: 12px
    }

    .err {
      color: var(--err);
      white-space: pre-wrap
    }

    a {
      color: var(--accent)
    }

    .step {
      border-left: 4px solid var(--line)
    }

    .step.st-RUNNING,
    .step.st-READY,
    .step.st-RETRYING {
      border-left-color: var(--accent)
    }

    .step.st-WAITING_INPUT,
    .step.st-WAITING_APPROVAL {
      border-left-color: var(--warn)
    }

    .step.st-COMPLETED {
      border-left-color: var(--ok)
    }

    .step.st-FAILED {
      border-left-color: var(--err)
    }

    .step-head {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .step-head .type {
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, monospace
    }

    .graph {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin: 10px 0
    }

    .graph .node {
      padding: 3px 10px;
      border-radius: 14px;
      border: 1px solid currentColor;
      font-size: 12px;
      cursor: pointer;
      background: var(--panel)
    }

    .graph .arrow {
      color: var(--muted)
    }

    .q {
      border-left: 3px solid var(--warn);
      padding-left: 10px;
      margin: 8px 0
    }

    .ev {
      display: grid;
      grid-template-columns: 96px 110px 60px 1fr;
      gap: 8px;
      padding: 4px 0;
      border-bottom: 1px dashed var(--line);
      font-size: 12.5px
    }

    .ev .c {
      white-space: pre-wrap;
      word-break: break-word
    }

    .ev.tool .c {
      color: var(--muted);
      font-family: ui-monospace, monospace;
      font-size: 11.5px
    }

    .ev.user .c {
      color: var(--accent)
    }

    details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0
    }

    .empty {
      color: var(--muted);
      padding: 30px;
      text-align: center
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--err);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      max-width: 480px;
      z-index: 10
    }

    .toast.info {
      background: var(--ok)
    }

    @media (max-width:820px) {
      main {
        padding: 16px
      }

      .grid2,
      .grid3 {
        grid-template-columns: 1fr
      }

      .ev {
        grid-template-columns: 50px 1fr
      }

      .ev .k,
      .ev .s {
        display: none
      }
    }

    #modal { max-width: 1280px; margin: 0 auto; padding: 0 28px 24px }
    #modal:empty { display: none }
    .convo { max-height: 640px; overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-top: 4px }
    .msg { margin: 6px 0; padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font-size: 13px }
    .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px }
    .msg .pre { white-space: pre-wrap; word-break: break-word }
    .msg.user { border-left: 3px solid var(--accent) }
    .msg.claude { border-left: 3px solid var(--ok) }
    .msg.tool { font-size: 12.5px; padding: 6px 10px }
    .msg.think, .msg.sys { color: var(--muted); font-style: italic; padding: 4px 10px }
    .msg.note { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 10px }
    .msg.done { border-left: 3px solid var(--muted) }
    .msg.live { border: 1px dashed var(--accent); color: var(--accent); background: transparent }
    .msg.sub { margin-left: 28px }
  </style>
</head>

<body>
  <header>
    <b>⚙︎ Workflow Platform</b>
    <a href="#/work-items" data-nav="work-items" data-key="nav.workItems">Work Items</a>
    <a href="#/runs" data-nav="runs" data-key="nav.runs">Runs</a>
    <a href="#/questions" data-nav="questions" data-key="nav.questions">Câu hỏi & duyệt<span id="qcount"></span></a>
    <a href="#/workflows" data-nav="workflows" data-key="nav.workflows">Workflows</a>
    <a href="#/knowledge" data-nav="knowledge" data-key="nav.knowledge">Knowledge</a>
    <a href="#/repositories" data-nav="repositories" data-key="nav.repositories">Repositories</a>
    <span id="lang" style="margin-left:auto;display:inline-flex;gap:4px;padding:8px 0">
      <button type="button" data-lang="vi" onclick="setUiLocale('vi')">VI</button>
      <button type="button" data-lang="en" onclick="setUiLocale('en')">EN</button>
    </span>
  </header>
  <main id="view">
    <div class="empty" data-key="cl.loading">Đang tải…</div>
  </main>
  <div id="modal"></div>
  <script src="/app.js"></script>
</body>

</html>
