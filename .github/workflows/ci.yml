name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless: cancel it instead of queueing both.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Code search falls back to ripgrep (src/codeIntelligence/search.ts); workers must have it, so CI does too.
  RIPGREP_VERSION: 15.1.0
  RIPGREP_SHA256: 1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # node_modules keyed by the lockfile: an unchanged lockfile skips `npm ci` entirely.
      - id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # tsc --incremental state (package.json `typecheck`); tsbuildinfo hashes every input, so a stale entry only costs time.
      - uses: actions/cache@v5
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - id: lint
        run: npm run lint
      - if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
        run: npm run build

  # platform-go: vet + unit, contract and extractor parity tests, and the production build (CGO: the tree-sitter
  # grammars are C). Cross-language suites (test/*-go.integration.ts) run in the test job and fail without Go.
  go:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # The process launcher's cgroup tests need a systemd user manager with delegation; lingering starts one.
      # Without it they are reported as skips (the process-tree and fail-closed cases always run).
      - name: Start a systemd user manager for delegated cgroup tests
        run: |
          sudo loginctl enable-linger "$USER" || true
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for i in $(seq 20); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
      - run: go vet ./...
      - run: go test -race ./internal/supervise/ ./internal/worker/
      - run: go test -race -run 'Search|Locale|QueryTerms|SortHits|Contract|AllowedRoots' ./internal/codeintelligence/
      - run: go test -race ./internal/knowledge/ ./internal/jsstr/
      - run: go test ./...
      - run: go build -trimpath -o bin/platform-go ./cmd/platform-go

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Pure static import-graph analysis (src/architecture/check.ts): no dependencies to install.
      - run: npm run arch:check

  autonomy-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # Deterministic, no provider/network: exits 1 on any false completion, unauthorized side effect or invariant violation.
      - run: npm run eval:autonomy:ci -- --out .eval/autonomy
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-eval
          path: .eval/autonomy

  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    strategy:
      fail-fast: false
      matrix:
        # Each shard runs a third of `npm run test:all`: unit files, then integration files on one shared cluster.
        shard: [1, 2, 3]
    name: test (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      # test/analytics-go.integration.ts, test/code-intelligence-go.integration.ts, test/code-search-go.integration.ts and
      # test/knowledge-import-go.integration.ts (engine parity, mandatory) build and run platform-go
      # against the test cluster; they fail (never skip) without a Go toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - id: ripgrep
        uses: actions/cache@v5
        with:
          path: ~/.local/ripgrep
          key: ripgrep-${{ runner.os }}-${{ env.RIPGREP_VERSION }}-${{ env.RIPGREP_SHA256 }}
      - name: Install ripgrep (pinned, checksum-verified)
        if: steps.ripgrep.outputs.cache-hit != 'true'
        run: |
          f="ripgrep-${RIPGREP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLo "/tmp/$f" "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/$f"
          echo "${RIPGREP_SHA256}  /tmp/$f" | sha256sum -c -
          mkdir -p ~/.local/ripgrep
          tar -xzf "/tmp/$f" -C ~/.local/ripgrep --strip-components=1
      - run: echo "$HOME/.local/ripgrep" >> "$GITHUB_PATH"
      - run: rg --version
      # test/pg-cluster.ts starts a private cluster with initdb/pg_ctl. Those binaries are not on the runner image.
      - name: Install PostgreSQL 17 and verification sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 bubblewrap
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/initdb --version
          bwrap --die-with-parent --unshare-pid --ro-bind / / --dev /dev --proc /proc true
      - name: npm test (unit, shard ${{ matrix.shard }}/3)
        run: >-
          node --disable-warning=ExperimentalWarning --import ./test/env.ts --test
          --test-shard=${{ matrix.shard }}/3 test/*.test.ts
      - name: npm run test:integration (shard ${{ matrix.shard }}/3)
        run: >-
          node --disable-warning=ExperimentalWarning test/run-integration.ts --test-concurrency=1
          --test-shard=${{ matrix.shard }}/3 test/*.integration.ts
