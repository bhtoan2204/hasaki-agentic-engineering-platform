services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.2-pg17
    container_name: hasaki-orbit-db
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - platform-pg:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: docker.io/ollama/ollama:0.40.16
    container_name: hasaki-orbit-ollama
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Keep bge-m3 loaded: reloading after the default 5-minute idle takes ~2 s, longer than a search deadline.
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - platform-ollama:/root/.ollama
      # The model registry is reached through a TLS-inspecting proxy: trust the host's CA bundle.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama-init:
    image: docker.io/ollama/ollama:0.40.16
    container_name: hasaki-orbit-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "bge-m3"]
    restart: "no"

volumes:
  platform-pg:
  platform-ollama:
